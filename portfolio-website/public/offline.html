<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline — Akash</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: linear-gradient(180deg, #fef7e0 0%, #f0b429 100%);
        color: #0d200d;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 1.75rem;
        margin: 0 0 12px;
      }
      p {
        max-width: 32rem;
        line-height: 1.6;
        color: rgba(13, 32, 13, 0.75);
        margin: 0 0 24px;
      }
      button {
        border: 1px solid rgba(13, 32, 13, 0.2);
        background: rgba(13, 32, 13, 0.05);
        color: #0d200d;
        font-weight: 600;
        padding: 10px 24px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.95rem;
      }
      button:hover {
        background: rgba(13, 32, 13, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>You're offline</h1>
      <p>
        Looks like the trail dropped signal. Reconnect and try again — this page will keep working
        once you're back online.
      </p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
