<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef7e0"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="60%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#sky)"/>

  <!-- Mountain back -->
  <path d="M0 32 L0 22 Q4 14 8 18 Q12 10 16 15 Q20 8 24 13 Q28 10 32 16 L32 32 Z" fill="#1d3d1d" opacity="0.35"/>

  <!-- Mountain front -->
  <path d="M0 32 L0 26 Q5 20 9 23 Q13 17 16 21 Q20 15 24 19 Q28 16 32 22 L32 32 Z" fill="#1d3d1d" opacity="0.7"/>

  <!-- Ground -->
  <path d="M0 32 L0 29 Q8 26 16 28 Q24 25 32 29 L32 32 Z" fill="#1d3d1d"/>

  <!-- Sun -->
  <circle cx="16" cy="13" r="5" fill="url(#sun)" opacity="0.95"/>
  <circle cx="16" cy="13" r="3.5" fill="#fffde7"/>
</svg>
