name: Snyk Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, offset from CodeQL's own Monday 03:27 schedule so they don't
    # both queue at once.
    - cron: "17 4 * * 1"

jobs:
  security:
    runs-on: ubuntu-latest
    # This workflow lives at the true repo root (required for GitHub Actions
    # to discover it at all — confirmed the hard way with ci.yml, which sat
    # one directory too deep for months and never actually ran), but the
    # app itself lives in portfolio-website/. Plain `run:` steps below
    # respect this; a third-party `uses:` action might not, which is
    # exactly why Snyk is invoked directly via `npx snyk` in a `run:` step
    # rather than the snyk/actions/node action, whose own working-directory
    # handling isn't something to assume without being able to verify it.
    defaults:
      run:
        working-directory: portfolio-website

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: portfolio-website/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Snyk to check for known vulnerabilities
        # continue-on-error: this repo has no SNYK_TOKEN secret configured
        # yet (that's a one-time step only the repo owner can do, via
        # snyk.io's free tier + GitHub connect) — until it's added, this
        # step fails on auth rather than silently skipping, which is
        # visible in the Actions tab as a flagged step without blocking
        # the rest of CI. Once the secret exists, this scans for real.
        continue-on-error: true
        run: npx snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
