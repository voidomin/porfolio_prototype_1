name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # This workflow lives at the true repo root (required — GitHub Actions
    # only ever discovers .github/workflows/ there, confirmed directly via
    # `gh workflow list` only showing CodeQL before this fix), but the
    # actual app lives in portfolio-website/. Every step below needs this.
    defaults:
      run:
        working-directory: portfolio-website

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: portfolio-website/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Type Checks
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test

      - name: Run Production Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e
